.header{background:linear-gradient(135deg,#1a3a5c 0%,#2c5f8a 100%);color:#fff;padding:20px 32px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,.15)}

.legend{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}

.tc{padding:0 24px 24px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}

thead th:hover{background:#eef1f5}
thead th .si{font-size:11px;color:#bbb;margin-left:4px}
thead th.sa .si,thead th.sd .si{color:#2c5f8a}
tbody tr{border-bottom:1px solid #f0f0f0;transition:background .15s}
tbody tr:nth-child(even){background:#fafbfc}
tbody tr:hover{background:#e8f0fe}
tbody td{padding:10px 14px;font-size:14px;color:#333;vertical-align:middle}
.td-un{font-family:Consolas,"Courier New",monospace;font-weight:600;font-size:15px;color:#1a3a5c;min-width:70px}

.pgnav{display:flex;justify-content:center;align-items:center;gap:6px;padding:20px 0 10px}

.pgnav button:hover:not(:disabled){background:#e8f0fe;border-color:#2c5f8a}

<script>
(function(){
  const PAGE = 30;
  let filtered = DATA.slice(), sortKey = null, sortDir = 0, page = 1;
  const $ = id => document.getElementById(id);

  function filter() {
    const un = $("sUN").value.trim(),
          nm = $("sName").value.trim().toLowerCase(),
          cl = $("sClass").value,
          pg = $("sPG").value;
    filtered = DATA.filter(d => {
      if (un && !d.un.startsWith(un)) return false;
      if (nm && !d.psnCn.toLowerCase().includes(nm)) return false;
      if (cl && d.mainClass !== cl) return false;
      if (pg && d.pg !== pg) return false;
      return true;
    });
    if (sortKey) {
      filtered.sort((a, b) => {
        let va = a[sortKey], vb = b[sortKey];
        if (va == null) va = ""; if (vb == null) vb = "";
        if (sortKey === "pg") {
          const po = {"I":1,"II":2,"III":3};
          va = po[va] || 99; vb = po[vb] || 99;
          return sortDir * (va - vb);
        }
        if (sortKey === "un") { va = parseInt(va)||0; vb = parseInt(vb)||0; return sortDir*(va-vb); }
        return sortDir * String(va).localeCompare(String(vb), "zh");
      });
    }
    page = 1;
    render();
  }

  function render() {
    $("tCnt").textContent = DATA.length;
    $("rCnt").textContent = filtered.length;
    $("fCnt").textContent = DATA.length;
    const start = (page-1)*PAGE, end = Math.min(start+PAGE, filtered.length);
    const slice = filtered.slice(start, end);
    const tb = $("tb");
    if (!slice.length) {
      tb.innerHTML = "";
      $("emp").style.display = "block";
      $("pgn").innerHTML = "";
      return;
    }
    $("emp").style.display = "none";
    let html = "";
    for (const d of slice) {
      const mc = parseInt(d.mainClass) || 0;
      const pgCls = d.pg==="I"?"p1":d.pg==="II"?"p2":d.pg==="III"?"p3":"p0";
      const pgText = d.pg ? PG_CN[d.pg] : "—";
      const scText = SUBCLASS_CN[d.subclass] || d.subclass || "—";
      // PSN显示（过长截断+title悬浮）
      const psnFull = d.psnCn || "";
      const psnShort = truncText(psnFull, 60);
      const psnHtml = psnFull.length > 60
        ? '<span class="psn-cell" title="' + escHtml(psnFull) + '">' + escHtml(psnShort) + '</span>'
        : '<span class="psn-cell">' + escHtml(psnFull) + '</span>';
      // 次要危险性
      let secHtml = "—";
      if (d.secondary) {
        const secs = parseSecondary(d.secondary);
        secHtml = secs.map(s => {
          const label = SEC_CLASS_CN[s] || s;
          return '<span class="sb">' + label + '</span>';
        }).join(" ");
      }
      html += '<tr>'
        + '<td class="td-un">' + d.un + '</td>'
        + '<td>' + psnHtml + '</td>'
        + '<td><span class="cb c' + mc + '">' + scText + '</span></td>'
        + '<td class="sec-wrap">' + secHtml + '</td>'
        + '<td><span class="pb ' + pgCls + '">' + pgText + '</span></td>'
        + '</tr>';
    }
    tb.innerHTML = html;
    renderPage();
  }

  function renderPage() {
    const total = Math.ceil(filtered.length / PAGE);
    if (total <= 1) { $("pgn").innerHTML = ""; return; }
    let h = '<button ' + (page<=1?'disabled':'') + ' onclick="window._go(' + (page-1) + ')">上一页</button>';
    const range = [];
    if (total <= 7) { for (let i=1; i<=total; i++) range.push(i); }
    else {
      range.push(1);
      if (page > 3) range.push("...");
      for (let i=Math.max(2,page-1); i<=Math.min(total-1,page+1); i++) range.push(i);
      if (page < total-2) range.push("...");
      range.push(total);
    }
    for (const p of range) {
      if (p === "...") h += '<span class="pi">...</span>';
      else h += '<button class="' + (p===page?"ac":"") + '" onclick="window._go(' + p + ')">' + p + '</button>';
    }
    h += '<button ' + (page>=total?'disabled':'') + ' onclick="window._go(' + (page+1) + ')">下一页</button>';
    $("pgn").innerHTML = h;
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  window._go = function(p) {
    const total = Math.ceil(filtered.length / PAGE);
    if (p < 1 || p > total) return;
    page = p;
    render();
    document.querySelector(".tc").scrollTop = 0;
  };

  // Sort
  document.querySelectorAll("thead th[data-k]").forEach(th => {
    th.addEventListener("click", () => {
      const k = th.dataset.k;
      if (sortKey === k) { sortDir = sortDir===1 ? -1 : sortDir===-1 ? 0 : 1; if (sortDir===0) sortKey=null; }
      else { sortKey = k; sortDir = 1; }
      document.querySelectorAll("thead th").forEach(t => t.classList.remove("sa","sd"));
      if (sortDir) th.classList.add(sortDir===1?"sa":"sd");
      filter();
    });
  });

  // Events
  $("sUN").addEventListener("input", filter);
  $("sName").addEventListener("input", filter);
  $("sClass").addEventListener("change", filter);
  $("sPG").addEventListener("change", filter);
  $("btnR").addEventListener("click", ()=>{
    $("sUN").value=""; $("sName").value=""; $("sClass").value=""; $("sPG").value="";
    sortKey=null; sortDir=0;
    document.querySelectorAll("thead th").forEach(t=>t.classList.remove("sa","sd"));
    filter();
  });

  filter();
})();
</script>
</body>
</html>
